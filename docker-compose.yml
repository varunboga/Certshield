version: "3.9"

services:
  mongodb:
    image: mongo:7.0
    container_name: certshield-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    build: ./backend
    container_name: certshield-backend
    ports:
      - "8000:8000"
    environment:
      - MONGODB_URL=mongodb://host.docker.internal:27017
      - MONGODB_DB_NAME=certshield
      - API_KEY=change-me
      - VERIFY_BASE_URL=http://localhost:3001/v
      - INSTITUTION_NAME=CertShield Institution
      - PRIVATE_KEY_PATH=keys/private_key.pem
      - PUBLIC_KEY_PATH=keys/public_key.pem
      - KEY_ID=key-2026-01
    depends_on:
      - mongodb
    volumes:
      - ./backend/keys:/app/keys

  admin-frontend:
    build: ./frontend-admin
    container_name: certshield-admin
    ports:
      - "3000:3000"
    command: npm run dev -- --host
    depends_on:
      - backend

  verification-frontend:
    build: ./frontend-portal
    container_name: certshield-portal
    ports:
      - "3001:3001"
    command: npm run dev -- --host
    depends_on:
      - backend

volumes:
  mongo_data: